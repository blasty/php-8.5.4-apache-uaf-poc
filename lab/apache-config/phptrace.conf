<FilesMatch ".+\.ph(?:ar|p|tml)$">
    SetHandler application/x-httpd-php
</FilesMatch>
DirectoryIndex index.php index.html
php_admin_value memory_limit 4M
php_admin_value post_max_size 8M
php_admin_value upload_max_filesize 8M
php_admin_value max_input_vars 1000
php_admin_value session.save_path /opt/php-uaf-lab/sessions/apache-clean
php_admin_flag session.upload_progress.enabled On
php_admin_flag session.upload_progress.cleanup Off
php_admin_value session.upload_progress.freq 1%
php_admin_value session.upload_progress.min_freq 0
php_admin_value session.serialize_handler php
<Directory /opt/php-uaf-lab/www-trace>
    Require all granted
    AllowOverride None
</Directory>
